525" text-anchor="start">Study preferences</text><text x="24" y="302" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#777777" text-anchor="start">How do you prefer to study?</text><rect x="24" y="320" width="342" height="63" rx="9" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2"/><text x="36" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#252525" text-anchor="start">Short focused sessions</text><text x="36" y="359" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#777777" text-anchor="start">Example: 25–30 minute study blocks</text><text x="356" y="340" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="500" fill="#777777" text-anchor="end">SELECTED</text><rect x="24" y="394" width="342" height="63" rx="9" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2"/><text x="36" y="414" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#252525" text-anchor="start">Longer study sessions</text><text x="36" y="433" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#777777" text-anchor="start">Example: 45–60 minute study blocks</text><rect x="24" y="468" width="342" height="63" rx="9" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2"/><text x="36" y="488" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#252525" text-anchor="start">A mix of activities</text><text x="36" y="507" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#777777" text-anchor="start">Reading, videos, practice and quizzes</text><rect x="24" y="650" width="342" height="46" rx="9" fill="#E7E7E7" stroke="#252525" stroke-width="1.6"/><text x="195.0" y="677.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#252525" text-anchor="middle">Continue</text><text x="195" y="718" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#777777" text-anchor="middle">We only ask for details that improve your plan.</text>
