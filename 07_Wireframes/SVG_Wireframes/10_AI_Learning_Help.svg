    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#252525" text-anchor="start">9:41</text><text x="366" y="28" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#252525" text-anchor="end">●  ●  ▰</text><line x1="20" y1="42" x2="370" y2="42" stroke="#E7E7E7" stroke-width="1"/><text x="24" y="78" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#252525" text-anchor="start">AI learning help</text><text x="24" y="100" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#777777" text-anchor="start">Statistics • Probability distributions</text><rect x="24" y="119" width="342" height="40" rx="7" fill="#F1F1F1" stroke="#B8B8B8" stroke-width="1"/><text x="36" y="144" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" fill="#252525" text-anchor="start">Current task: Probability distributions</text><text x="24" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#252525" text-anchor="start">What would you like help with?</text><rect x="24" y="207" width="110" height="28" rx="14" fill="#E7E7E7" stroke="#252525" stroke-width="1.2"/><text x="79.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" fill="#252525" text-anchor="middle">Explain simply</text><rect x="142" y="207" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2"/><text x="190.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" fill="#252525" text-anchor="middle">Summarise</text><rect x="246" y="207" width="120" height="28" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2"/><text x="306.0" y="225" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="500" fill="#252525" text-anchor="middle">Give an example</text><rect x="24" y="258" width="342" height="270" rx="8" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2"/><text x="38" y="284" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#777777" text-anchor="start">AI-generated explanation</text><text x="38" y="314" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#252525" text-anchor="start">A probability distribution shows the possible</text><text x="38" y="331" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#252525" text-anchor="start">values of a variable and the probability of each</text><text x="38" y="348" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#252525" text-anchor="start">value occurring. The probabilities add up to 1.</text><text x="38" y="365" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#252525" text-anchor="start"></text><text x="38" y="382" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#252525" text-anchor="start">Example:</text><text x="38" y="399" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#252525" text-anchor="start">For a fair coin, P(Heads) = 0.5 and</text><text x="38" y="416" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#252525" text-anchor="start">P(Tails) = 0.5.</text><rect x="38" y="453" width="314" height="52" rx="5" fill="#F1F1F1" stroke="#B8B8B8" stroke-width="1"/><text x="48" y="474" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" fill="#777777" text-anchor="start">Source: [Show source when available]</text><text x="48" y="486" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" fill="#777777" text-anchor="start">Check important facts with your course materials.</text><rect x="24" y="558" width="342" height="54" rx="8" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.2"/><text x="38" y="590" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#777777" text-anchor="start">Ask a follow-up question...</text><rect x="296" y="566" width="60" height="38" rx="9" fill="#E7E7E7" stroke="#252525" stroke-width="1.6"/><text x="326.0" y="589.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#252525" text-anchor="middle">Send</text><rect x="24" y="632" width="342" height="40" rx="9" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.6"/><text x="195.0" y="656.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#252525" text-anchor="middle">Back to current task</text>
